# CI: harness self-check (always) + checks / db / e2e (once the app and supabase/ exist).
# Mark `checks`, `db`, `e2e` as REQUIRED status checks on main so deploy-db (D14, no Branching)
# never applies migrations from a failing PR. Skipped jobs (before W1 scaffold) report as skipped.
#
# TODO(unverified): third-party action major versions (pnpm/action-setup, actions/setup-node,
# supabase/setup-cli, actions/upload-artifact, gitleaks/gitleaks-action) were not re-verified.
# Pin them (ideally to commit SHAs) and dry-run this workflow in W1.
name: ci

on:
  pull_request:
  push:
    branches: [main, stg, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  GENERATION_PROVIDER: mock
  # Upload layer 2 checks without OpenAI / Anthropic calls (deterministic; src/lib/moderation/layer2.ts).
  MODERATION_PROVIDER: mock
  # OAuth providers are enabled in supabase/config.toml; CI never runs real OAuth, so placeholders
  # only let the local Auth server start.
  SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
  SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
  SUPABASE_AUTH_EXTERNAL_KAKAO_CLIENT_ID: ci-placeholder
  SUPABASE_AUTH_EXTERNAL_KAKAO_SECRET: ci-placeholder

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.d.outputs.app }}
      db: ${{ steps.d.outputs.db }}
    steps:
      - uses: actions/checkout@v6
      - id: d
        run: |
          if [ -f package.json ]; then echo "app=true" >> "$GITHUB_OUTPUT"; else echo "app=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f supabase/config.toml ]; then echo "db=true" >> "$GITHUB_OUTPUT"; else echo "db=false" >> "$GITHUB_OUTPUT"; fi

  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Parse harness JSON
        run: |
          for f in .claude/settings.json .mcp.json docs/features.json vercel.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" && echo "ok $f"
          done
      - name: Hook scripts are executable and parse
        run: |
          for f in .claude/hooks/*.sh; do
            test -x "$f" || { echo "not executable: $f"; exit 1; }
            bash -n "$f"
          done
          bash -n .claude/hooks/lib/common.sh
      - name: shellcheck hooks
        run: shellcheck -x .claude/hooks/*.sh .claude/hooks/lib/common.sh scripts/*.sh

  checks:
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4          # TODO(unverified): version
      - uses: actions/setup-node@v4         # TODO(unverified): version
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  db:
    needs: detect
    if: needs.detect.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1         # CLI version pinned below; bump with local `supabase --version`
        with:
          version: 2.120.0 # pinned: "latest" queries the GitHub API unauthenticated and hits rate limits
      - run: supabase start
      - run: supabase db reset              # local only; never --linked / --db-url
      - run: supabase test db
      - name: RLS on every public/private table
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/check-rls.sql
      - name: Generated types are up to date
        if: hashFiles('src/types/database.types.ts') != ''
        run: |
          supabase gen types typescript --local > src/types/database.types.ts
          git diff --exit-code -- src/types/database.types.ts

  e2e:
    needs: detect
    if: needs.detect.outputs.app == 'true' && needs.detect.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0 # pinned: "latest" queries the GitHub API unauthenticated and hits rate limits
      - run: supabase start
      - run: supabase db reset
      - name: Local Supabase env for the app
        # TODO(unverified): variable names printed by `supabase status -o env`
        # (PUBLISHABLE_KEY/SECRET_KEY on newer CLIs, ANON_KEY/SERVICE_ROLE_KEY on older ones).
        # These are the public local-dev demo keys, not secrets.
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Start app
        run: |
          pnpm start > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 > /dev/null && exit 0; sleep 2; done
          cat /tmp/next.log; exit 1
      - run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4    # TODO(unverified): version
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Optional: secret scanning. gitleaks-action needs GITLEAKS_LICENSE only for organization accounts.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2   # TODO(unverified): version / license requirement
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional (blueprint): validate a vendored sprint-flow plugin copy, if you add one under plugins/.
  # plugin:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - run: npm install -g @anthropic-ai/claude-code
  #     - run: claude plugin validate --strict plugins/sprint-flow
