# Claude PR review on money / security paths only (official code-review plugin workflow + path filter).
# Do NOT remove the --allowedTools line: the inline-comment MCP server only starts when it is named there.
# .claude/rules/money.md loads automatically when the reviewer reads matching files.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "supabase/**"
      - "src/lib/payments/**"
      - "src/lib/credits/**"
      - "src/app/**/checkout/**"
      - "src/app/api/**"
      - "src/data/**"

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
      - name: Show Claude error (result text only)
        # The action hides the result message. Print only its error text (no conversation) so
        # failures are diagnosable in this public repo without show_full_output.
        if: failure()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: jq -r '(if type=="array" then .[] else . end) | select(.type=="result") | "subtype=\(.subtype) is_error=\(.is_error) result=\(.result // "")"' "$EXEC_FILE" || echo "no execution file at $EXEC_FILE"
