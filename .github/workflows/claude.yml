# @claude in issue / PR comments (official workflow core + cost limits).
# Secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, subscription).
# github_token is intentionally omitted: the action then authenticates as the Claude GitHub App,
# so CI also runs on Claude's commits (commits made with the default GITHUB_TOKEN don't trigger workflows).
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: "claude-${{ github.event.issue.number || github.event.pull_request.number }}"
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 20"
      - name: Show Claude error (result text only)
        # The action hides the result message. Print only its error text (no conversation) so
        # failures are diagnosable in this public repo without show_full_output.
        if: failure()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: jq -r '(if type=="array" then .[] else . end) | select(.type=="result") | "subtype=\(.subtype) is_error=\(.is_error) result=\(.result // "")"' "$EXEC_FILE" || echo "no execution file at $EXEC_FILE"
