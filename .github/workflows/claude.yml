# @claude in issue / PR comments (official workflow core + cost limits).
# Secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, subscription).
# github_token is intentionally omitted: the action then authenticates as the Claude GitHub App,
# so CI also runs on Claude's commits (commits made with the default GITHUB_TOKEN don't trigger workflows).
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: "claude-${{ github.event.issue.number || github.event.pull_request.number }}"
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 20"
