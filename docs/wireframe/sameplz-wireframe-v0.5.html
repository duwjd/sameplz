<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>SAMEPLZ 와이어프레임</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: inverted wireframe toolbar -> framed site canvas (GNB + page) -> annotation rail from 1180px. Square corners, grayscale only. */
  --bg:#ffffff;--fg:#121212;--mute:#5f5f5f;--hair:#cdcdcd;--fill:#eeeeee;--fill2:#f7f7f7;--ph:#dddddd;--ph2:#c6c6c6;--ph-ink:#5a5a5a;--scrim:rgba(0,0,0,.55);
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--fg:#efefef;--mute:#a8a8a8;--hair:#3b3b3b;--fill:#1f1f1f;--fill2:#171717;--ph:#2d2d2d;--ph2:#404040;--ph-ink:#a3a3a3;--scrim:rgba(0,0,0,.72);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e0e;--fg:#efefef;--mute:#a8a8a8;--hair:#3b3b3b;--fill:#1f1f1f;--fill2:#171717;--ph:#2d2d2d;--ph2:#404040;--ph-ink:#a3a3a3;--scrim:rgba(0,0,0,.72);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box;border-radius:0!important}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
pre{margin:0}
input[type=search]::-webkit-search-decoration,input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--hair)}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono)}
.mute{color:var(--mute)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.help{font-size:12.5px;color:var(--mute);line-height:1.5}
.req{font-family:var(--mono);font-size:11px;border:1px solid var(--fg);padding:0 4px;margin-left:4px;font-weight:500}
.err{font-size:12.5px;font-weight:600}
.err:empty{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:grid;gap:16px}
.h1{font-size:clamp(22px,3cqi,30px);font-weight:700;letter-spacing:-.01em}
.h2{font-size:19px;font-weight:700}
.h3{font-size:16px;font-weight:600;margin-bottom:10px}
.h4{font-size:14px;font-weight:600;margin-bottom:8px}

/* wireframe toolbar */

/* shell */
#app:focus{outline:none}

/* GNB */
.gnb{border-bottom:1px solid var(--fg)}
.gnb-top{display:flex;gap:16px;align-items:center;padding:12px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:19px;letter-spacing:.03em}
.logo-mark{width:30px;height:30px;background:var(--fg);display:grid;align-content:center;justify-items:center;gap:5px;flex:none}
.logo-mark i{display:block;width:16px;height:4px;background:var(--bg)}
.gsearch{flex:1;min-width:220px;display:flex}
.gsearch .in{border-right:0}
.gsearch .btn{flex:none;white-space:nowrap}
.gnb-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:11px;margin-left:4px}
.avatar{width:36px;height:36px;background:var(--ph);display:grid;place-items:center;font-size:12px;color:var(--ph-ink);font-weight:600}
.gnb-nav{display:flex;gap:2px;padding:0 12px;border-top:1px solid var(--hair);flex-wrap:wrap;align-items:center}
.gnb-nav a{padding:10px 10px;text-decoration:none;font-size:14px;border-bottom:3px solid transparent;margin-bottom:-1px}
.gnb-nav a.cat{font-weight:600;font-size:15px}
.gnb-nav a[aria-current="page"]{border-bottom-color:var(--fg)}
.gnb-nav .sep{width:1px;height:18px;background:var(--hair);margin:0 8px}
@container vp (max-width:760px){.gnb-act .btn{padding:6px 10px}}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border:1px solid var(--fg);background:var(--bg);color:var(--fg);font-weight:500;font-size:14px;text-decoration:none;line-height:1.2;transition:background-color .15s,color .15s}
.btn:hover{background:var(--fill)}
.btn.pri{background:var(--fg);color:var(--bg)}
.btn.pri:hover{opacity:.86}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.wide{width:100%}
.btn.big{min-height:54px;font-size:16px;font-weight:700;letter-spacing:.01em}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:13px;cursor:pointer}
.link-like{font-size:13px;text-decoration:underline;text-underline-offset:3px;color:var(--mute)}
.in{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--fg);background:var(--bg);color:var(--fg);-webkit-appearance:none;appearance:none}
.in.sm{min-height:36px;padding:6px 10px;font-size:13px}
.in::placeholder{color:var(--mute)}
textarea.in{min-height:140px;resize:vertical;line-height:1.65}
.in[type=file]{padding:6px;font-size:13px}
.in[type=file]::file-selector-button{border:1px solid var(--fg);background:var(--bg);color:var(--fg);padding:6px 12px;margin-right:10px;font:inherit;cursor:pointer}
.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:600}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.inline .in{flex:1;min-width:160px;width:auto}
.chk{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:14px;padding:5px 0;position:relative;line-height:1.45}
.chk input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.chk .box{flex:none;width:18px;height:18px;padding:0;gap:0;border:1.5px solid var(--fg);display:grid;place-items:center;margin-top:1px;background:var(--bg)}
.chk input:checked+.box::after{content:"";width:10px;height:10px;background:var(--fg)}
.chk input:focus-visible+.box{outline:2px solid var(--fg);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--fg);background:var(--bg);padding:7px 11px;font-size:13px;min-height:36px;line-height:1.2;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.chip:hover{background:var(--fill)}
.chip[aria-pressed="true"],.chip.on,.chip[aria-current="page"]{background:var(--fg);color:var(--bg)}
.chip .mono{font-size:11px;opacity:.75}
.tagx{font-size:13px;text-decoration:none;color:var(--mute)}
.tagx:hover{color:var(--fg);text-decoration:underline}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--fg);max-width:100%}
.seg button{border:0;border-right:1px solid var(--fg);background:var(--bg);padding:8px 12px;min-height:38px;font-size:13px;line-height:1.2}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--fill)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--fg)}
.tabs button{border:1px solid transparent;border-bottom:0;background:none;padding:10px 14px;font-size:14px;white-space:nowrap;margin-bottom:-1px;min-height:44px}
.tabs button:hover{background:var(--fill2)}
.tabs button[aria-selected="true"]{border-color:var(--fg);background:var(--bg);font-weight:600;box-shadow:0 1px 0 var(--bg)}
.sw{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;min-height:40px;font-size:14px;text-align:left}
.sw .tr{width:42px;height:24px;border:1.5px solid var(--fg);position:relative;flex:none}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;background:var(--fg);transition:transform .15s}
.sw[aria-checked="true"] .tr{background:var(--fg)}
.sw[aria-checked="true"] .tr::after{transform:translateX(18px);background:var(--bg)}
.bar{height:8px;border:1px solid var(--fg)}
.bar i{display:block;height:100%;background:var(--fg);width:0}
.tag{display:inline-block;border:1px solid var(--fg);font-family:var(--mono);font-size:11px;line-height:1.5;padding:0 6px;white-space:nowrap;vertical-align:middle}
.tag.inv{background:var(--fg);color:var(--bg)}
.tblw{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl.wide{min-width:560px}
.tbl th,.tbl td{border:1px solid var(--fg);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--fill);font-weight:600}
.box{border:1px solid var(--fg);padding:16px;display:grid;gap:10px;min-width:0}
.alert{border:1px solid var(--fg);display:flex;gap:10px 14px;align-items:center;padding:12px 14px;flex-wrap:wrap;font-size:14px}
.alert>span:nth-child(2){flex:1;min-width:200px}
.alert .k{background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:11px;padding:2px 7px;white-space:nowrap}
.ph{background:var(--ph);color:var(--ph-ink);display:grid;place-items:center;font-family:var(--mono);font-size:11px;line-height:1.5;text-align:center;padding:8px;position:relative;width:100%;max-width:100%}
.ph.dark{background:var(--ph2)}
.ph.tall{width:min(100%,300px);margin-inline:auto}
.sq-av{width:32px;height:32px;background:var(--ph);flex:none;display:inline-block}
.nbox{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:12px;font-weight:600}
.bul{display:grid;gap:6px}
.bul li{display:flex;gap:10px;align-items:baseline}
.bul li::before{content:"";flex:none;width:6px;height:6px;background:var(--fg);transform:translateY(-2px)}
.grid2{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
/* single-column grids: let the track shrink so wide tables scroll inside .tblw instead of widening the page */
.page,.stack,.det-main,.det-head,.samples,.box,.hero,.res,.co-main,.spanel,.col-b,.tile-b,.card-b,.buy,.dlg-b,.field,.lib-info,.empty,.done,.scard,.filters,.kpi,.gpt,.gpt-b,.catb,.sec-h{grid-template-columns:minmax(0,1fr)}
.grid2>*,.br>*,.det>*,.co>*{min-width:0}

/* page */
.page{padding:24px 20px 40px;display:grid;gap:32px;min-width:0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sh>div:not(.seg){display:grid;gap:6px;min-width:0}
.crumb{font-size:13px;color:var(--mute)}
.crumb a{color:inherit}
.foot{border-top:1px solid var(--fg);padding:20px;font-size:12.5px;color:var(--mute);display:grid;gap:8px}
.foot b{color:var(--fg)}

/* home */
.hero{border-bottom:1px solid var(--fg);padding:40px 20px 28px;display:grid;gap:16px;background:var(--fill2)}
.hero h1{font-size:clamp(30px,5cqi,52px);font-weight:700;letter-spacing:-.025em;line-height:1.15}
.hero .lead{font-size:16px;max-width:60ch}
.bigsearch{display:flex;border:2px solid var(--fg);max-width:780px;background:var(--bg)}
.bigsearch input{flex:1;min-width:0;width:100%;border:0;padding:14px 16px;font-size:17px;background:transparent;-webkit-appearance:none;appearance:none}
.bigsearch input:focus-visible{outline:none}
.bigsearch:focus-within{outline:2px solid var(--fg);outline-offset:2px}
.bigsearch button{border:0;border-left:2px solid var(--fg);background:var(--fg);color:var(--bg);padding:0 24px;font-weight:600;font-size:15px}
.pop{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:16px}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.catblocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.catb{border:1px solid var(--fg);padding:16px;text-decoration:none;display:grid;gap:8px;align-content:start;background:var(--bg);transition:transform .15s,box-shadow .15s}
.catb:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 0 var(--fg)}
.catb b{font-size:24px;letter-spacing:-.01em}
.catb .mono{font-size:12px}
.rank{display:grid;border-top:1px solid var(--fg)}
.rank li a{display:grid;grid-template-columns:40px 56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--hair);text-decoration:none}
.rank li a:hover{background:var(--fill2)}
.rank .no{font-family:var(--mono);font-size:22px;font-weight:600;text-align:center}
.rank .ph{aspect-ratio:1;padding:2px;font-size:10px}
.rank .t{display:grid;gap:2px;min-width:0}
.rank .t b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .mv{font-family:var(--mono);font-size:11px;text-align:right;white-space:nowrap}
.creators{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.crt{border:1px solid var(--fg);padding:12px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.crt .sq{width:44px;height:44px;background:var(--ph)}
.crt>div{display:grid;gap:2px;min-width:0}
.band{background:var(--fg);color:var(--bg);padding:28px 24px;display:grid;gap:12px;justify-items:start}
.band .eyebrow{color:var(--bg);opacity:.75}
.band .btn{background:var(--fg);color:var(--bg);border-color:var(--bg)}
.band .btn.pri{background:var(--bg);color:var(--fg)}
.band p{max-width:62ch}

/* card */
.card{border:1px solid var(--fg);display:flex;flex-direction:column;background:var(--bg);text-decoration:none;color:inherit;min-width:0;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 0 var(--fg)}
.card .ph{border-bottom:1px solid var(--fg);aspect-ratio:4/3}
.cardtype{position:absolute;top:8px;left:8px}
.cardfree{position:absolute;top:8px;right:8px}
.card-b{padding:12px;display:grid;gap:8px;flex:1;align-content:start}
.card-t{font-size:15px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-s{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--mute)}
.card-p{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-top:1px solid var(--hair);padding-top:8px;margin-top:auto}
.card-p b{font-family:var(--mono);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--mute);font-family:var(--mono)}
.stats b{color:var(--fg);font-weight:600}
.mini-pipe{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center}
.mini-pipe i{font-style:normal;border:1px solid var(--ph-ink);padding:2px 6px;background:var(--fill2);color:var(--fg)}

/* browse */
.cattabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--fg)}
.cattabs a{padding:12px 16px;text-decoration:none;border-left:1px solid var(--fg);display:grid;gap:2px}
.cattabs a:first-child{border-left:0}
.cattabs a:hover{background:var(--fill)}
.cattabs a[aria-current="page"]{background:var(--fg);color:var(--bg)}
.cattabs b{font-size:18px}
.cattabs span{font-size:12px;font-family:var(--mono)}
.br{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@container vp (min-width:920px){.br{grid-template-columns:236px minmax(0,1fr)}.ftoggle{display:none!important}}
.filters{border:1px solid var(--fg);padding:14px;display:none;gap:18px;align-content:start;margin-top:8px}
.filters.open{display:grid}
@container vp (min-width:920px){.filters{display:grid;margin-top:0}}
.filters fieldset{display:grid;gap:2px}
.filters legend{margin-bottom:6px}
.filters .chk{font-size:13.5px;padding:3px 0}
.res{display:grid;gap:14px;align-content:start;min-width:0}
.res-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.empty{border:1px dashed var(--fg);padding:28px 20px;display:grid;gap:12px;justify-items:start}

/* detail */
.det{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
@container vp (min-width:1000px){.det{grid-template-columns:minmax(0,1fr) 320px}}
.det-main{display:grid;gap:28px;min-width:0;align-content:start}
.det-head{display:grid;gap:10px}
.det-t{font-size:clamp(22px,3cqi,30px);font-weight:700;letter-spacing:-.01em}
.det-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.statbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--fg)}
.statbar div{padding:10px 12px;border-left:1px solid var(--fg);display:grid;gap:2px}
.statbar div:first-child{border-left:0}
.statbar b{font-family:var(--mono);font-size:20px;line-height:1.2}
.statbar span{font-size:12px;color:var(--mute)}
@container vp (max-width:520px){.statbar{grid-template-columns:repeat(2,minmax(0,1fr))}.statbar div:nth-child(3){border-left:0}.statbar div:nth-child(n+3){border-top:1px solid var(--fg)}}
.reg{border:2px solid var(--fg);padding:12px 14px;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:14px}
.reg span:nth-child(2){flex:1;min-width:220px}
.samples{display:grid;gap:10px}
.smp-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.thumbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.th{aspect-ratio:1;border:1px solid transparent;font-size:12px}
.th[aria-pressed="true"]{border:2px solid var(--fg)}
.dsec{display:grid;gap:12px;min-width:0}
.dsec>h2{font-size:17px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dsec>h2 .mono{font-size:13px;font-weight:500;color:var(--mute)}
.prompt{border:1px solid var(--fg);padding:12px 14px;font-size:14px;line-height:2;background:var(--fill2);min-width:0;overflow-wrap:anywhere}
.prompt.sm{font-size:13px;line-height:1.8;padding:10px}
.mask{display:inline-block;height:.85em;background:var(--fg);vertical-align:-.06em;margin:0 .1em;max-width:100%}
.var{border:1px dashed var(--fg);padding:0 4px;font-family:var(--mono);font-size:12.5px;background:var(--bg);white-space:nowrap}
.samegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@container vp (min-width:720px){.samegrid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.samegrid figure{margin:0;display:grid;gap:4px}
.samegrid figcaption{font-size:12px;color:var(--mute)}
.steps-ol{display:grid;gap:12px}
.steps-ol li{display:flex;gap:12px;align-items:flex-start}
.code{font-family:var(--mono);font-size:13px;border:1px solid var(--fg);padding:8px 8px 8px 12px;background:var(--fill2);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.chat{display:grid;gap:8px}
.chat .u{justify-self:end;background:var(--fg);color:var(--bg);padding:8px 12px;max-width:85%}
.chat .s{justify-self:start;border:1px solid var(--fg);padding:8px 12px;max-width:85%;background:var(--fill2);font-size:14px}
.ba{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.ba>div{border:1px solid var(--fg);padding:12px;display:grid;gap:6px;align-content:start;font-size:14px;white-space:pre-line}
.ba>div:last-child{background:var(--fill2)}
.pipe{display:flex;flex-wrap:wrap;gap:8px 0;align-items:stretch}
.pipe .st{border:1px solid var(--fg);padding:10px 12px;min-width:132px;flex:1;display:grid;gap:2px;align-content:start;background:var(--bg)}
.pipe .st .mono{font-size:11px;color:var(--mute)}
.pipe .ar{display:grid;place-items:center;padding:0 6px;font-family:var(--mono);color:var(--mute)}
.runlog{font-family:var(--mono);font-size:12.5px;border:1px solid var(--fg);background:var(--fill2);padding:12px;min-height:132px;display:grid;gap:4px;align-content:start}
.cando{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.cando>div{border:1px solid var(--fg);padding:12px;display:grid;gap:8px;align-content:start}
.tree{display:grid;gap:2px;font-size:13px}
.tree li::before{content:"";display:inline-block;width:8px;height:1px;background:var(--fg);vertical-align:middle;margin-right:8px}
.pre{border:1px solid var(--fg);padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--fill2);max-height:320px;overflow:auto}
.log{display:grid}
.log li{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--hair);font-size:14px}
.rev-list{display:grid;gap:14px}
.rev-list li{border-top:1px solid var(--hair);padding-top:12px;display:grid;gap:6px;font-size:14px}
.rv-h{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.reply{border:1px solid var(--hair);padding:8px 10px;background:var(--fill2);font-size:13px}
.safe{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.buy-wrap{min-width:0}
.mcta{display:none}
@container vp (max-width:999px){.mcta{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;bottom:0;z-index:20;margin:0 -20px -40px;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--fg)}.mcta>div{display:grid;gap:2px;min-width:0}.mcta .btn{flex:none}}
.buy{border:2px solid var(--fg);padding:16px;display:grid;gap:12px;background:var(--bg)}
@container vp (min-width:1000px){.buy{position:sticky;top:16px}}
.price{font-size:28px;font-weight:600;line-height:1.2}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sellerbox{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--hair);padding-top:12px}

/* checkout */
.costeps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--fg)}
.costeps li{padding:10px 12px;font-size:13px;font-family:var(--mono);border-left:1px solid var(--fg);color:var(--mute)}
.costeps li:first-child{border-left:0}
.costeps li.on{color:var(--fg);font-weight:600}
.costeps li.cur{background:var(--fg);color:var(--bg)}
.co{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@container vp (min-width:960px){.co{grid-template-columns:minmax(0,1fr) 300px}}
.co-main{display:grid;gap:16px;min-width:0}
.co-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start}
.co-sum{align-self:start}
@container vp (min-width:960px){.co-sum{position:sticky;top:16px}}
.sum{display:grid;gap:8px;margin:0}
.sum div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.sum dd{margin:0}
.sum .tot{border-top:1px solid var(--fg);padding-top:8px;font-weight:700;font-size:16px}
.fine{font-size:12.5px;color:var(--mute);border-top:1px solid var(--hair);padding-top:12px}
.done{justify-items:start;padding:28px}

/* library */
.lib{display:grid;border-top:1px solid var(--fg)}
.lib-row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--fg);align-items:start}
.lib-info{display:grid;gap:4px;min-width:0}
.lib-info a{text-decoration:none}
.lib-info a:hover b{text-decoration:underline}
.lib-act{grid-column:2}
@container vp (min-width:880px){.lib-row{grid-template-columns:88px minmax(0,1fr) auto}.lib-act{grid-column:auto;justify-content:flex-end;max-width:380px}}

/* builder */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--fg)}
.steps button{border:0;border-left:1px solid var(--fg);background:var(--bg);padding:10px;text-align:left;font-size:13px;min-height:58px;display:grid;gap:2px;align-content:start}
.steps button:first-child{border-left:0}
.steps button:hover{background:var(--fill)}
.steps button[aria-current="step"]{background:var(--fg);color:var(--bg)}
.steps .sn{font-size:11px}
@container vp (max-width:640px){.steps .st{display:none}.steps button{min-height:44px;text-align:center}}
.type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.tcard{border:1px solid var(--fg);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;position:relative}
.tcard:has(input:checked){background:var(--fill)}
.tcard input{position:absolute;opacity:0;width:1px;height:1px}
.tcard .box{flex:none;width:18px;height:18px;padding:0;gap:0;border:1.5px solid var(--fg);display:grid;place-items:center;margin-top:2px;background:var(--bg)}
.tcard input:checked+.box::after{content:"";width:10px;height:10px;background:var(--fg)}
.tcard input:focus-visible+.box{outline:2px solid var(--fg);outline-offset:2px}
.tcard>span:last-child{display:grid;gap:4px}
.gpt{border:1px dashed var(--fg);padding:12px 14px;display:grid;gap:10px;justify-items:start}
.gpt-b{display:grid;gap:10px;width:100%}
.files{display:grid;gap:4px;font-size:13px;margin-top:4px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px}
.scard{border:1px solid var(--fg);padding:10px;display:grid;gap:8px;align-content:start}
.sadd{border:1px dashed var(--fg);background:var(--bg);min-height:170px;display:grid;place-items:center;align-content:center;gap:4px;font-size:14px;font-weight:600}
.sadd:hover{background:var(--fill2)}
.stepedit{display:grid;gap:8px}
.stepedit li{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
@container vp (max-width:560px){.stepedit li{grid-template-columns:24px minmax(0,1fr) auto}.stepedit li .in:nth-of-type(2){grid-column:2/3}}
.bnav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--fg);padding-top:16px}
.checks{display:grid;gap:6px}
.checks li{display:flex;gap:10px;align-items:baseline;font-size:14px;flex-wrap:wrap}
.ok{display:inline-block;min-width:44px;text-align:center;font-family:var(--mono);font-size:11px;border:1px solid var(--fg);padding:0 6px;background:var(--bg)}
.ok.warn{background:var(--fill);font-weight:600}
.ok.fail{background:var(--fg);color:var(--bg)}
.ok.idle{color:var(--mute);border-color:var(--hair)}
.result{border:2px solid var(--fg);padding:14px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* feed */
.masonry{columns:4 220px;column-gap:16px}
.tile{break-inside:avoid;margin-bottom:16px;border:1px solid var(--fg);background:var(--bg);display:grid}
.tile .ph{border-bottom:1px solid var(--fg)}
.tile-b{padding:12px;display:grid;gap:8px}
.tile-b .orig{font-size:12.5px}

/* collection */
.col{border:1px solid var(--fg);display:grid;align-content:start}
.col-ph{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:var(--fg);border-bottom:1px solid var(--fg);aspect-ratio:16/8}
.col-ph .ph:first-child{grid-row:1/3}
.col-ph .ph{height:100%}
.col-b{padding:14px;display:grid;gap:8px;justify-items:start}
.col-l{display:grid;gap:3px;font-size:13px;color:var(--mute)}
.col-l li::before{content:"";display:inline-block;width:5px;height:5px;background:var(--mute);margin-right:8px;vertical-align:middle}

/* seller */
.spanel{display:grid;gap:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{border:1px solid var(--fg);padding:12px 14px;display:grid;gap:4px}
.kpi b{font-size:24px;font-weight:600;line-height:1.2}
.stack-bar{display:flex;height:30px;border:1px solid var(--fg)}
.stack-bar i{display:block;height:100%}
.stack-bar .d,.sw-d{background:var(--fg)}
.stack-bar .m,.sw-m{background:var(--ph2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;border:1px solid var(--fg)}
.links{display:grid}
.links li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13px}
.links li .mono{flex:1;min-width:200px;overflow-wrap:anywhere}
.flow{display:grid;gap:8px}
.flow li{display:flex;gap:10px;align-items:center;font-size:14px}
[id^="t-"]{scroll-margin-top:72px}

/* notes */
.notes-on [data-note]{position:relative;outline:1px dashed var(--fg);outline-offset:3px}
.notes-on [data-note]::before{content:attr(data-note);position:absolute;top:-10px;left:-10px;z-index:6;min-width:22px;height:22px;padding:0 5px;background:var(--fg);color:var(--bg);font:600 12px/22px var(--mono);text-align:center;pointer-events:none}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{outline:4px solid var(--fg);outline-offset:6px}100%{outline:1px dashed var(--fg);outline-offset:3px}}

/* modal, toast */
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--fg);position:sticky;top:0;background:var(--bg)}
.dlg-h b{font-size:16px}
.dlg-b{padding:16px;display:grid;gap:12px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--fg)}
.dlg-f:empty{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}


/* v0.3: wireframe controls */
.wfsim{border:1px dashed var(--fg);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:repeating-linear-gradient(135deg,var(--bg) 0 8px,var(--fill2) 8px 16px)}
.wfsim.sm{padding:4px 6px;gap:4px}
.wfsim-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;background:var(--fg);color:var(--bg);padding:1px 6px;text-transform:uppercase}
.wfsim-l{font-size:13px;font-weight:600}
.wfbtn{border-style:dashed}
select.in{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg) 50%),linear-gradient(135deg,var(--fg) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}

/* rail tabs, scenarios */
.scn-steps{display:grid;gap:6px}
.scn-steps li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:13px;line-height:1.5;padding:6px;border:1px solid transparent}
.scn-steps li .nbox{background:var(--bg);color:var(--fg);border:1px solid var(--fg)}
.scn-steps li.done{color:var(--mute)}
.scn-steps li.done .nbox{background:var(--fg);color:var(--bg)}
.scn-steps li.next{border-color:var(--fg);font-weight:600;background:var(--fill2)}
.scn-ok{border:2px solid var(--fg);padding:10px;font-size:13px}

/* gate, notifications */
.gate{max-width:640px}
.nlist{display:grid;border-top:1px solid var(--fg)}
.nlist li a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:14px 4px;border-bottom:1px solid var(--hair);text-decoration:none;font-size:14px}
.nlist li a:hover{background:var(--fill2)}
.nlist li.unread a{font-weight:600}

/* detail, library additions */
.mine-box{display:grid;gap:8px}
.alert.own{border-width:2px}
.errbox{border-width:2px}
.stopped{max-width:720px}
.tcard.off{opacity:.45;cursor:not-allowed}
.checklist{display:grid;gap:8px}
.checklist li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.checklist li>span:nth-child(2){flex:1;min-width:180px}
.checklist li.done{color:var(--mute)}
.onboard{border-width:2px}

/* playground */
.pg{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@container vp (min-width:1000px){.pg{grid-template-columns:340px minmax(0,1fr)}}
.pgl{border:1px solid var(--fg);padding:14px;display:grid;gap:14px;align-content:start;min-width:0}
@container vp (min-width:1000px){.pgl{position:sticky;top:16px}}
.pgr{display:grid;gap:14px;align-content:start;min-width:0}
.pgcred{border:1px solid var(--fg);padding:8px 10px;display:flex;gap:10px;align-items:center}
.pgcred b{font-size:18px}
.pgvars{display:grid;gap:10px}
.pgmodels{display:grid;gap:0}
.pgmodels .chk.off{opacity:.45;cursor:not-allowed}
.pgopts{gap:12px}
.pgrunbar{display:grid;gap:6px;border-top:1px solid var(--fg);padding-top:12px}
.pgmode{border-width:2px}
.pgrun{border:1px solid var(--fg);padding:12px;display:grid;gap:10px;min-width:0}
.pgrun.running{border-style:dashed}
.pgrun-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.pgrun-h .help{flex:1;min-width:160px}
.pgcols{display:grid;gap:10px;min-width:0}
.pgcol{display:grid;gap:6px;align-content:start;min-width:0}
.pgcol>b{font-size:12px;border-bottom:1px solid var(--fg);padding-bottom:4px}
.pgouts{display:grid;gap:8px}
.pgouts[data-multi]{grid-template-columns:repeat(2,minmax(0,1fr))}
.pgout{margin:0;display:grid;gap:6px;min-width:0}
.pgout figcaption{gap:4px}
.pgout .btn.sm{min-height:32px;padding:4px 8px;font-size:12px}
.wm{position:absolute;inset:auto 0 40% 0;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--fg);opacity:.5;transform:rotate(-12deg)}
.aimark{position:absolute;right:6px;bottom:6px;background:var(--bg)}
@container vp (max-width:640px){.pgcols{grid-template-columns:minmax(0,1fr)!important}}
.pgcol:only-child .pgout{max-width:440px}

/* v0.4: dialogs and toasts live inside the fake browser viewport */
.modal{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--bg);border:2px solid var(--fg);width:100%;max-width:560px;max-height:calc(100% - 16px);overflow:auto;display:grid}
@container vp (min-width:1000px){.notes-on .pgl[data-note]{position:sticky}}

/* ================= v0.4 wireframe tool: screen list | fake browser | notes & exceptions ================= */
html,body{height:100%}
body{overflow:hidden;font-size:14px}
#wf{--lw:256px;--rw:344px;display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);height:100vh;height:100dvh}
#wf.l-off{--lw:0px}#wf.r-off{--rw:0px}
#wf.l-off #toolL,#wf.r-off #toolR{display:none}
#toolL{grid-column:1;grid-row:1}#stage{grid-column:2;grid-row:1}#toolR{grid-column:3;grid-row:1}
.tool{background:var(--fill2);overflow:auto;font-size:12.5px;line-height:1.55;min-width:0;min-height:0;overscroll-behavior:contain}
#toolL{border-right:1px solid var(--fg);padding:12px 10px 48px}
#toolR{border-left:1px solid var(--fg);padding:12px 12px 48px}
.tool h4{margin:18px 4px 6px;font:600 11px/1.4 var(--mono);letter-spacing:.06em;color:var(--mute)}
.tool h4:first-child,.tool .drawer-x+h4{margin-top:2px}
.drawer-x{display:none;margin:0 0 8px auto;border:1px solid var(--fg);background:var(--bg);color:var(--fg);font-size:12px;font-weight:600;padding:6px 12px;min-height:32px}
.tool .it{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;color:var(--fg);font-size:12.5px;min-height:30px;line-height:1.35}
.tool .it:hover{background:var(--fill)}
.tool .it.cur{background:var(--fg);color:var(--bg)}
.tool .it .lb{flex:1;min-width:0}
.tool .it .mn{flex:none;font:700 10.5px/1 var(--mono);border:1px solid currentColor;padding:2px 4px}
.tool .it .ex{flex:none;font:500 10.5px/1 var(--mono);color:var(--mute);white-space:nowrap}
.tool .it.cur .ex{color:inherit;opacity:.8}
.tool .it .no{flex:none;width:20px;font:600 11px/1 var(--mono);color:var(--mute)}
.tool .it.cur .no{color:inherit}
.tool .it .dn{flex:none;font:700 11px/1 var(--mono)}
.qs{display:grid;gap:6px}
.qs button{border:1px solid var(--fg);background:var(--bg);color:var(--fg);padding:8px 10px;text-align:left;font-size:12.5px;font-weight:600;line-height:1.35}
.qs button small{display:block;font-weight:400;color:var(--mute);font-size:11.5px;margin-top:2px}
.qs button:hover{background:var(--fg);color:var(--bg)}.qs button:hover small{color:inherit;opacity:.8}
.scnd{margin-top:10px;border:1px solid var(--hair);background:var(--bg)}
.scnd>summary{cursor:pointer;padding:8px 10px;font-weight:600;font-size:12.5px;list-style:none;display:flex;justify-content:space-between;gap:8px}
.scnd>summary::-webkit-details-marker{display:none}
.scnd>summary::after{content:'펼치기';font:500 11px/1.6 var(--mono);color:var(--mute)}
.scnd[open]>summary::after{content:'접기'}
.scnd[open]>summary{border-bottom:1px solid var(--hair)}
.scnd ol{padding:4px}
/* right panel */
.tnote{background:var(--bg);border:1px solid var(--fg);padding:12px;margin-bottom:10px}
.tnote h5{margin:0 0 4px;font-size:14.5px;line-height:1.35}
.tnote>p{margin:0 0 4px}
.tnote ul{list-style:square;padding-left:16px}
.tnote li{margin:2px 0}
.tnote .tsec{margin-top:10px;padding-top:8px;border-top:1px solid var(--hair)}
.tnote .tsec>b{display:block;font:600 11px/1.4 var(--mono);color:var(--mute);margin-bottom:3px}
.tnote .back{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--mute)}
.tnote.scn{border-width:2px}
.tnote.scn .eyebrow{display:block;margin-bottom:2px}
.tnote.scn .bar{margin:8px 0}
.crs{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 2px}
.crs span{border:1px solid var(--fg);padding:1px 6px;font-size:11px;font-weight:600;background:var(--bg)}
.exb{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:1px dashed var(--fg);background:var(--bg);color:var(--fg);padding:7px 9px;margin-bottom:6px;font-size:12.5px;line-height:1.4}
.exb:hover{background:var(--fg);color:var(--bg);border-style:solid}
.exb i{font-style:normal;font-weight:800;flex:none;font-family:var(--mono)}
.tlab{font-size:11.5px;color:var(--mute);font-weight:600;margin-top:8px}
.tctl{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.tctl button{border:1px solid var(--hair);background:var(--bg);color:var(--fg);padding:4px 8px;font-size:11.5px;min-height:28px;line-height:1.3;text-align:left}
.tctl button:hover{border-color:var(--fg)}
.tctl button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tctl button[disabled]{opacity:.4;cursor:not-allowed;border-style:dashed}
.tctl.help-btns button{border-style:dashed;border-color:var(--fg)}
.anl{display:grid;border:1px solid var(--hair);background:var(--bg)}
.anl li+li{border-top:1px solid var(--hair)}
.anl button{display:grid;grid-template-columns:auto 1fr;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--fg);padding:7px 8px;font-size:12px;line-height:1.45}

/* ---------- library ---------- */
function libStatus(l, x){
  const until = addDays(l.bought, 7);
  if (x.status === 'stopped') return ['판매 종료 · 받은 버전은 계속 써요', 'stop'];
  if (l.paid === 0) return [l.viewed ? '무료 · 열어 봄' : '무료', 'free'];
  if (l.viewed) return ['열어 봄 · 환불 제한', 'viewed'];
  if (dayDiff(until) > 0) return ['열기 전 · 환불 기간 지남', 'late'];
  return [`열기 전 · ${md(until)}까지 환불 가능`, 'refundable'];
}
function libRow(l, i){
  const x = byId(l.id), st = libStatus(l, x);
  const canPlay = x.cat === 'prompt' && runnableOf(x).length;
  const refund = st[1] === 'refundable' ? `<button class="btn sm" type="button" data-act="refund" data-id="${x.id}">환불 요청</button>` : st[1] === 'viewed' || st[1] === 'stop' ? `<button class="link" type="button" data-act="report" data-id="${x.id}" data-r="0">설명과 달라요</button>` : '';

      <p class="help">${CAT[x.cat]} · ${l.ver} 고정${l.ver !== x.version ? ` · 새 버전 ${x.version}` : ' · 최신'} · ${dot(l.bought)} · ${l.paid ? krw(l.paid) : '무료'}</p>
      <div${i === 0 ? ' data-note="2"' : ''}><span class="tag${st[1] === 'viewed' || st[1] === 'stop' ? ' inv' : ''}">${st[0]}</span></div></div>

  </li>`;
}

const PATH = {home:'/', feed:'/gallery', market:'/market', prompt:'/market/prompts', agent:'/market/agents', skill:'/market/skills', collection:'/market/collections', play:'/play', checkout:'/checkout', policy:'/guide', my:'/my', library:'/my/library', orders:'/my/orders', credits:'/my/credits', notifs:'/my/notifications', activity:'/my/activity', seller:'/my/studio', create:'/my/studio/upload', profile:'/my/profile', account:'/my/account'};
function splitQ(h){ const i = h.indexOf('?'); return i < 0 ? [h, ''] : [h.slice(0, i), h.slice(i)]; }
function h2url(full){
  const [h, q] = splitQ(full || 'home');
  if (h === 'nf') return new URLSearchParams(q.slice(1)).get('p') || '/404';
  if (h.indexOf('item-') === 0) return '/r/' + h.slice(5) + q;
  if (h.indexOf('play-') === 0) return '/play/' + h.slice(5) + q;
  return (PATH[h] !== undefined ? PATH[h] : '/' + h) + q;
}
function url2h(u){
  u = String(u || '').trim().replace(/^https?:\/\//, '').replace(/^(www\.)?sameplz\.example/, '');
  if (!u.startsWith('/')) u = '/' + u;
  let [p, q] = splitQ(u); p = p.replace(/\/+$/, '') || '/';
  const k = Object.keys(PATH).find(x => PATH[x] === p); if (k) return k + q;
  let m = /^\/r\/([\w-]+)$/.exec(p); if (m) return 'item-' + m[1] + q;
  m = /^\/play\/([\w-]+)$/.exec(p); if (m) return 'play-' + m[1] + q;
  return 'nf?p=' + encodeURIComponent(p + q);
}

  pgtorecipe(){ const pg = S.pg, r = A().runs.find(z => z.tpl === 'blank' && z.status === 'ok'); const inv = {}; Object.keys(TOOL2MODEL[r.kind]).forEach(t => { inv[TOOL2MODEL[r.kind][t]] = t; }); S.b = newBuilder(); Object.assign(S.b, {cat:'prompt', kind:r.kind, prompt:r.prompt || pg.prompt || '', tools:r.models.map(k => inv[k]).filter(Boolean), ratio:r.ratio || '1:1', samples:Array.from({length:Math.min(9, Math.max(1, r.models.length * r.count))}, () => ({link:'', play:true})), fromPlay:true, touched:true, step:1}); go('create'); },
  genmode(t){ S.genMode = t.dataset.v; setPressed(t); },
  charge(){ if (!need(() => openCharge(0))) return; openCharge(0); },
  chargeDo(){ if (srvFail()) { const e = $('#chErr2'); if (e) e.textContent = '오류: 결제 서버가 응답하지 않아 충전하지 못했어요. 결제되지 않았어요.'; return; } const i = Number(($('input[name="pack"]:checked') || {value:0}).value), p = PACKS[i]; A().credits += p[1]; cpush(A(), `충전 · ${krw(p[0])} · 카드`, p[1]); ev('charge'); closeModal(true); paint(); toast(`${p[1].toLocaleString('ko-KR')}크레딧을 충전했어요.`); }
};
const IN = {
  btitle(t){ S.b.title = t.value; S.b.touched = true; if (S.b.err.title && t.value.trim()) { S.b.err.title = false; $('#btitleE').textContent = ''; } },
  bprompt(t){ S.b.prompt = t.value; S.b.scan = null; S.b.touched = true; clearTimeout(IN._pt); IN._pt = setTimeout(() => { const v = $('#bvars'); if (!v) return; v.innerHTML = varTable(); $('#vcount').textContent = `${varsOf(S.b.prompt).length}개 인식`; $('#bprev').innerHTML = promptPreview(S.b.prompt); }, 160); },
  bvar(t){ const n = t.dataset.name; (S.b.meta[n] = S.b.meta[n] || {desc:'', ex:''})[t.dataset.f] = t.value; },
  bparams(t){ S.b.params = t.value; },
  bskill(t){ S.b.skillMd = t.value; S.b.scan = null; S.b.touched = true; },
  btrig(t){ S.b.triggers = t.value; S.b.scan = null; S.b.touched = true; },
  bstepn(t){ S.b.steps[Number(t.dataset.i)][0] = t.value; S.b.scan = null; },
  bstepd(t){ S.b.steps[Number(t.dataset.i)][1] = t.value; },
  bneed(t){ S.b.need = t.value; },
  bnote(t){ S.b.changeNote = t.value; },
  slink(t){ S.b.samples[Number(t.dataset.i)].link = t.value; },
  bprice(t){ S.b.price = Number(t.value) || 0; const f = $('#bfee'); if (f) f.innerHTML = feeBox(); },
  scalc(t){ S.seller.calc = Number(t.value) || 0; $('#calcOut').innerHTML = calcOut(); },
  pgvar(t){ S.pg.vals[t.dataset.k] = t.value; },
  pgprompt(t){ S.pg.prompt = t.value; }
};
const CH = {
  f(t){ const a = S.f[S.cat][t.dataset.k], v = t.value, i = a.indexOf(v); if (t.checked && i < 0) a.push(v); if (!t.checked && i >= 0) a.splice(i, 1); if (S.cat === 'prompt' && t.dataset.k === 'kind') { paint(); return; } renderResults(); },
  agree(t){ S.agree[t.dataset.k] = t.checked; const ok = S.agree.a1 && S.agree.a2; if (ok) ev('agree:all'); $('#payBtn').disabled = !ok; $('#payHelp').textContent = ok ? '결제하면 라이브러리에 바로 들어가요.' : '필수 동의 2개를 체크하면 결제할 수 있어요.'; },
  bcat(t){ S.b.cat = t.value; S.b.tools = [toolsFor(t.value, S.b.kind)[t.value === 'prompt' ? 1 : 0]]; S.b.scan = null; S.b.touched = true; paint(); },
  bvis(t){ S.b.vis = t.value; S.b.scan = null; paint(); },
  brefs(t){ S.b.refs = Array.from(t.files || []).map(f => ({name:f.name, size:f.size})); $('#breflist').innerHTML = refList(); },
  pgtpl(t){ go(t.value ? 'play-' + t.value : 'play'); },
  pgref(t){ S.pg.refs = Array.from(t.files || []).map(f => f.name); paint(); },
  pgconsent(t){ S.pg.consent = t.checked; if (t.checked && S.pg.err.indexOf('동의') >= 0) { S.pg.err = ''; $('#pgErr').textContent = ''; } },
  pgmodel(t){ const pg = S.pg, v = t.value; if (t.type === 'radio') pg.models = [v]; else { const i = pg.models.indexOf(v); if (t.checked && i < 0) { if (pg.models.length >= 3) { t.checked = false; toast('비교는 3개까지예요.'); return; } pg.models.push(v); } if (!t.checked && i >= 0) pg.models.splice(i, 1); } paint(); }
};
const SUB = {
  hero(){ ACT._search($('#hq').value.trim()); },
  gsearch(){ const v = $('#gq').value.trim(); $('#gq').value = ''; ACT._search(v); },
  browse(){ S.q = $('#bq').value.trim(); renderResults(); refreshRail(); },
  coupon(){
    const code = $('#cpn').value.trim().toUpperCase(), msg = $('#cpnMsg'), x = byId(S.co.id);
    if (!code) { msg.textContent = '쿠폰 코드를 입력해 주세요.'; return; }
    const k = Object.keys(D.ACC).find(a => D.ACC[a].seller && D.ACC[a].seller.coupons.some(c => c.code === code));
    if (!k) { msg.textContent = '오류: 쿠폰 코드를 찾을 수 없어요. 철자를 확인해 주세요.'; return; }
    if (x.owner !== k) { msg.textContent = `오류: 이 쿠폰은 ${D.ACC[k].name}의 레시피에만 쓸 수 있어요.`; return; }
    const c = D.ACC[k].seller.coupons.find(z => z.code === code);
    S.coupon = {code, rate:c.rate, by:D.ACC[k].name}; ev('coupon:ok'); paint(); toast('쿠폰을 적용했어요. 이 구매는 직접 유입으로 잡혀요.');
  }
};


/* ================= tool actions (panels, browser chrome, overlays) ================= */
function freshUI(){ if (!$('#modal').hidden) closeModal(true); S.pending = null; S.payErr = ''; S.pg.err = ''; }
function closeMap(){ if (T.map) { T.map = false; renderMap(); } }
function showR(){ if (window.innerWidth > 1180) $('#wf').classList.remove('r-off'); }
const TOOL = {
  jump(t){ closeMap(); freshUI(); const f = JUMP[t.dataset.j]; if (f) f(); },
  ex(t){ closeMap(); freshUI(); const f = EX[t.dataset.x]; if (f) f[1](); },
  scn(t){
    const sc = SCN.find(s => s.id === t.dataset.v); if (!sc) return;
    closeMap(); if (!$('#modal').hidden) closeModal(true);
    resetAll(sc.who); S.scn = sc.id; S.scnDone = []; if (sc.preset) sc.preset();
    S.h = ''; nav(sc.start, {replace:true}); S.hist = []; S.fwd = []; syncChrome(); showR(); syncHead(); fit();
    toast(`시나리오 시작: ${sc.title} · 데이터를 처음 상태로 돌렸어요`, {sim:1});
  },
  scnEnd(){ S.scn = null; renderTool(); },
  case(t){ const r = CASE_ROWS[Number(t.dataset.i)]; if (r) { freshUI(); r.set(t.dataset.v); } },
  g(t){ const r = GLOBAL_ROWS[Number(t.dataset.i)]; if (r) r.set(t.dataset.v); },
  help(t){ const h = HELP_ROWS[Number(t.dataset.i)]; if (h) h[1](); },
  note(t){
    const n = Number(t.dataset.n), key = noteKey(), it = ((NOTES[key] || {}).items || [])[n - 1], extra = (it && it[2]) || {};
    if (!$('#modal').hidden) closeModal(true);
    if (extra.step && S.route === 'create' && logged()) { const toSkill = n === 3 && S.b.cat !== 'skill'; if (toSkill) { S.b.cat = 'skill'; S.b.tools = ['Claude']; S.b.scan = null; } if (toSkill || S.b.step !== extra.step) { S.b.step = extra.step; paint(); } }
    const el = $(`#app [data-note="${n}"]`);
    if (!el) { toast('이 요소는 지금 상태에서 보이지 않아요. 경우의 수나 예외를 바꿔 보세요.', {sim:1}); return; }
    reveal(el); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  },
  sim(t){
    const k = t.dataset.k;
    if (k === 'offline') { S.sim.offline = !S.sim.offline; paint(); toast(S.sim.offline ? '연결이 끊긴 상태예요. 결제·만들기 버튼이 멈춰요.' : '다시 연결됐어요.', {sim:S.sim.offline}); }
    else if (k === 'srv') { S.sim.srv = !S.sim.srv; renderTool(); if (S.sim.srv) toast('다음에 누르는 결제·충전·만들기·올리기·환불·로그인 한 번이 서버 오류로 멈춰요.', {sim:1}); }
    else if (k === 'session') TOOL.session();
  },
  session(){
    if (!logged()) { toast('로그인한 뒤에 쓸 수 있어요. 오른쪽 「보는 계정」을 먼저 바꿔 주세요.', {sim:1}); return; }
    const h = S.h, prev = S.acct; switchAcct('guest'); S.relogin = prev; paint();
    need(() => nav(h)); toast('로그인이 만료됐어요. 다시 로그인하면 보던 화면으로 돌아와요.');
  },
  reconnect(){ S.sim.offline = false; paint(); toast('다시 연결됐어요.'); },
  notes(){ T.notes = !T.notes; applyView(); renderToolR(); },
  spec(){ T.spec = !T.spec; applyView(); renderToolR(); spDraw(); },
  map(){ T.map = !T.map; renderMap(); syncHead(); },
  zoom(){ T.zoom = T.zoom === '100' ? 'fit' : '100'; fit(); syncHead(); renderToolR(); },
  device(t){ setDevice(t.dataset.v); },
  toggleL(){ const a = $('#wf'); if (window.innerWidth > 900) a.classList.toggle('l-off'); else { a.classList.toggle('l-on'); a.classList.remove('r-on'); } syncHead(); requestAnimationFrame(fit); },
  toggleR(){ const a = $('#wf'); if (window.innerWidth > 1180) a.classList.toggle('r-off'); else { a.classList.toggle('r-on'); a.classList.remove('l-on'); } syncHead(); requestAnimationFrame(fit); },
  back(){ if (!S.hist.length) return; S.fwd.push(S.h); const h = S.hist.pop(); const f = S.fwd.slice(); nav(h, {hist:false}); S.fwd = f; syncChrome(); },
  fwd(){ if (!S.fwd.length) return; S.hist.push(S.h); const h = S.fwd.pop(), f = S.fwd.slice(); nav(h, {hist:false}); S.fwd = f; syncChrome(); },
  reload(){ freshUI(); const k = S.pg.blankKind; if (S.route === 'play') { const id = S.pg.id; S.pg = newPg(); S.pg.id = id; S.pg.blankKind = k; } nav(S.h, {hist:false}); toast('화면을 다시 불러왔어요. 입력 중이던 값은 지워지고, 받은 레시피·크레딧 같은 데이터는 그대로예요.', {sim:1}); },
  closePop(){ S.pending = null; closeModal(); },
  toastx(t){ TOASTS = TOASTS.filter(x => String(x.id) !== t.dataset.id); renderToasts(); },
  reset(){ closeMap(); if (!$('#modal').hidden) closeModal(true); resetAll('guest'); S.h = ''; nav('home', {replace:true}); S.hist = []; S.fwd = []; syncChrome(); toast('모든 데이터와 상태를 처음으로 돌렸어요.', {sim:1}); }
};

Object.assign(ACT, MYACT); Object.assign(IN, MYIN); Object.assign(CH, MYCH);

/* ================= event wiring ================= */
function refocus(t){
  if (!t || !t.closest || document.contains(t)) return;
  const sel = ['data-t','data-i','data-v','data-x','data-j','data-n','data-k'].filter(a => t.hasAttribute(a)).map(a => `[${a}="${CSS.escape(t.getAttribute(a))}"]`).join('');
  const n = sel && $('#wf ' + sel + ', #fmapLayer ' + sel); if (n) n.focus({preventScroll:true});
}
document.addEventListener('click', e => {
  if (S.mkOpen && !e.target.closest('#gmk')) { S.mkOpen = false; updateGnb(); }
  const tt = e.target.closest('[data-t]');
  if (tt) { if (tt.disabled) return; const fn = TOOL[tt.dataset.t]; if (fn) { e.preventDefault(); fn(tt, e); refocus(tt); } return; }
  const t = e.target.closest('[data-act]');
  if (t) {
    if (t.disabled) return;
    const fn = ACT[t.dataset.act];
    if (fn) { e.preventDefault(); fn(t, e); if (t.tagName === 'A' && t.dataset.act === 'close') { const hr = t.getAttribute('href'); if (hr && hr[0] === '#') nav(hr.slice(1)); } refreshRail(); }
    return;
  }
  const a = e.target.closest('a[href^="#"]');
  if (a) { e.preventDefault(); nav(a.getAttribute('href').slice(1)); }
});
document.addEventListener('input', e => { const t = e.target.closest('[data-in]'); if (t && IN[t.dataset.in]) IN[t.dataset.in](t, e); });
document.addEventListener('change', e => { const t = e.target.closest('[data-ch]'); if (t && CH[t.dataset.ch]) { CH[t.dataset.ch](t, e); refreshRail(); } });
document.addEventListener('submit', e => { const f = e.target; if (f.dataset && f.dataset.sub && SUB[f.dataset.sub]) { e.preventDefault(); SUB[f.dataset.sub](f, e); refreshRail(); } });
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('scnd')) T.scnOpen = e.target.open; }, true);
document.addEventListener('keydown', e => {
  if (e.target.id === 'urlIn' && e.key === 'Enter') { e.preventDefault(); const h = url2h(e.target.value); e.target.blur(); freshUI(); nav(h); return; }
  if (e.target.id === 'urlIn' && e.key === 'Escape') { e.target.blur(); syncChrome(); return; }
  if (e.key !== 'Escape') return;
  if (T.map) { T.map = false; renderMap(); syncHead(); return; }
  if (S.mkOpen) { S.mkOpen = false; updateGnb(); const b = $('#gmkBtn'); if (b) b.focus({preventScroll:true}); return; }
  if (!$('#modal').hidden) { S.pending = null; closeModal(); return; }
  const w = $('#wf'); if (w.classList.contains('r-on') || w.classList.contains('l-on')) { w.classList.remove('r-on', 'l-on'); syncHead(); }
});
$('#urlIn').addEventListener('focus', e => e.target.select());
$('#urlIn').addEventListener('blur', () => setTimeout(syncChrome, 0));
$('#modal').addEventListener('click', e => { if (e.target === $('#modal')) { S.pending = null; closeModal(); } });
vp.addEventListener('scroll', spSched, {passive:true});
window.addEventListener('resize', () => { fit(); syncHead(); });
if (window.ResizeObserver) new ResizeObserver(() => fit()).observe($('#scaler'));

/* rolling banner: 5s, stops on hover or focus inside, off when reduced motion is on */
setInterval(() => {
  if (!S.hb.play || S.route !== 'home' || document.hidden || !$('#modal').hidden || T.map) return;
  const hb = $('#hb'); if (!hb || hb.matches(':hover') || hb.contains(document.activeElement)) return;
  S.hb.i = (S.hb.i + 1) % BANNERS.length; hbPaint();
}, 5000);

/* ================= boot ================= */
resetAll('guest');
T.device = window.innerWidth < 760 ? 'mobile' : 'desktop';
fit();
S.h = ''; nav('home', {replace:true});
syncHead();
setTimeout(() => toast('왼쪽에서 화면을 고르고, 오른쪽에서 예외와 경우의 수를 눌러 보세요. 위 「플로우 맵」으로 전체 흐름도 볼 수 있어요.', {sim:1, ms:8000}), 400);
})();

</script>
